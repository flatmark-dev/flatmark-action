# Generated by listing-sync (infra scripts/listing_sync/connectors); edits are overwritten.
# Runs the action from this repo against the live API on every push, without a key (the anonymous tier).
name: smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch the samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/samples"
          curl -sS --fail-with-body -o "$RUNNER_TEMP/samples/sample.pdf" https://flatmark.dev/app-static/samples/sample.pdf
      - name: get_me
        id: get_me
        uses: ./
        with:
          operation: get_me
      - name: list_jobs
        id: list_jobs
        uses: ./
        with:
          operation: list_jobs
      - name: convert_document
        id: convert_document
        uses: ./
        with:
          operation: convert_document
          file: ${{ runner.temp }}/samples/sample.pdf
      - name: Check every answer was written
        shell: bash
        env:
          OUT_0: ${{ steps.get_me.outputs.output }}
          OUT_1: ${{ steps.list_jobs.outputs.output }}
          OUT_2: ${{ steps.convert_document.outputs.output }}
        run: |
          set -euo pipefail
          for out in "$OUT_0" "$OUT_1" "$OUT_2"; do
            test -s "$out" || { echo "::error::empty answer: $out"; exit 1; }
          done
